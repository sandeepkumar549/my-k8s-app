# configmap.yaml
# Think of this as a sticky note with settings for your app.
# NOT for passwords — just normal settings.

apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-app-config
  namespace: my-app
data:
  # Your app reads these like environment variables
  APP_NAME: "Hello App"
  APP_ENV: "production"
  APP_PORT: "8080"
  LOG_LEVEL: "info"
  GREETING_MESSAGE: "Hello, World! Welcome to Kubernetes!"
