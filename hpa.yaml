# hpa.yaml
# THE MAGIC SCALER ✨
# Automatically adds MORE pods when your app gets busy,
# and removes them when things calm down.
#
# Think of it like: If the restaurant gets crowded, hire more waiters!
# When it's quiet again, fewer waiters needed.
#
# Requires metrics-server to be installed:
#   kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hello-app-hpa
  namespace: my-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hello-app   # Which deployment to scale

  minReplicas: 2    # Never go below 2 pods (always have backups)
  maxReplicas: 10   # Never go above 10 pods (cost control)

  metrics:
    # Scale up when CPU usage > 70%
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

    # Scale up when memory usage > 80%
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
