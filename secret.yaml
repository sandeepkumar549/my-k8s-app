# secret.yaml
# Think of this as a locked box 🔒 — for passwords and API keys.
# Values must be base64 encoded.
#
# To encode: echo -n "mysecretpassword" | base64
# To decode: echo "bXlzZWNyZXRwYXNzd29yZA==" | base64 --decode

apiVersion: v1
kind: Secret
metadata:
  name: hello-app-secret
  namespace: my-app
type: Opaque
data:
  # "mysecretpassword" encoded in base64
  DB_PASSWORD: bXlzZWNyZXRwYXNzd29yZA==
  # "myapikey123" encoded in base64
  API_KEY: bXlhcGlrZXkxMjM=
